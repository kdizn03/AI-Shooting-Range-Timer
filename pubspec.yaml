name: shot_timer_ai
description: AI-powered gunshot detection timer for shooting range practice sessions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  audioplayers: ^6.1.0
  drift: ^2.22.1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  intl: ^0.19.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  record: ^5.2.0
  riverpod_annotation: ^2.6.1
  sqlite3_flutter_libs: ^0.5.28
  tflite_flutter: ^0.11.0
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.14
  build_verify: ^3.1.0
  drift_dev: ^2.22.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/sounds/
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-JetBrainsMono.txt

  # Bundled OFL-licensed typefaces (licenses in assets/fonts/OFL-*.txt).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
